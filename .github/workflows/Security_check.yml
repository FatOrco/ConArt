name: Security Check
on:
    push:
        branches:
            - main
            - dev
    schedule:
        - cron: '0 0 * * MON'

permissions:
    contents: read

jobs:
    vulnerability_scan:
        name: Vulnerability scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Scan dependencies and code for vulnerabilities
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: fs
                  scanners: vuln
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'

    secret_scan:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Scan git history for leaked secrets
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
